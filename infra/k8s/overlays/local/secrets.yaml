apiVersion: v1
kind: Secret
metadata:
  name: echofs-secrets
  namespace: echofs
type: Opaque
stringData:
  jwt-secret: "local-dev-secret-not-for-production"
  database-url: "postgres://echofs:echofs-local-pass@postgres:5432/echofs?sslmode=disable"
  postgres-user: "echofs"
  postgres-password: "echofs-local-pass"
