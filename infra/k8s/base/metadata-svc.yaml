apiVersion: apps/v1
kind: Deployment
metadata:
  name: metadata
  namespace: echofs
  labels:
    app: metadata
    app.kubernetes.io/component: metadata
spec:
  replicas: 1
  selector:
    matchLabels:
      app: metadata
  template:
    metadata:
      labels:
        app: metadata
    spec:
      containers:
        - name: metadata
          image: ghcr.io/OWNER/echofs-metadata:latest
          ports:
            - containerPort: 8083
              name: http
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: echofs-secrets
                  key: jwt-secret
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: echofs-secrets
                  key: database-url
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: metadata
  namespace: echofs
spec:
  selector:
    app: metadata
  ports:
    - port: 8083
      targetPort: http
      name: http
