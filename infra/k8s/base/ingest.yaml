apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingest
  namespace: echofs
  labels:
    app: ingest
    app.kubernetes.io/component: ingest
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ingest
  template:
    metadata:
      labels:
        app: ingest
    spec:
      containers:
        - name: ingest
          image: ghcr.io/OWNER/echofs-ingest:latest
          ports:
            - containerPort: 8081
              name: http
          env:
            - name: ORCHESTRATOR_URL
              value: "http://orchestrator:8082"
            - name: METADATA_URL
              value: "http://metadata:8083"
            - name: WORKER1_URL
              value: "storage-node-0.storage-node:10081"
            - name: WORKER2_URL
              value: "storage-node-1.storage-node:10081"
            - name: WORKER3_URL
              value: "storage-node-2.storage-node:10081"
            - name: REPLICATION_FACTOR
              value: "3"
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ingest
  namespace: echofs
spec:
  selector:
    app: ingest
  ports:
    - port: 8081
      targetPort: http
      name: http
