apiVersion: apps/v1
kind: Deployment
metadata:
  name: master
  namespace: echofs
  labels:
    app: master
    app.kubernetes.io/component: master
spec:
  replicas: 1
  selector:
    matchLabels:
      app: master
  template:
    metadata:
      labels:
        app: master
    spec:
      containers:
        - name: master
          image: ghcr.io/OWNER/echofs-master:latest
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: echofs-secrets
                  key: jwt-secret
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: echofs-secrets
                  key: database-url
            - name: ORCHESTRATOR_URL
              value: "http://orchestrator:8082"
            - name: WORKER1_URL
              value: "storage-node-0.storage-node:10081"
            - name: WORKER2_URL
              value: "storage-node-1.storage-node:10081"
            - name: WORKER3_URL
              value: "storage-node-2.storage-node:10081"
            - name: REPLICATION_FACTOR
              value: "3"
            - name: FRONTEND_URL
              value: "https://echofs.yourdomain.dev"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: master
  namespace: echofs
spec:
  selector:
    app: master
  ports:
    - port: 8080
      targetPort: http
      name: http
